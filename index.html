                if(currentCategory !== 'ALL' && p.category !== currentCategory) return;
                
                count++;
                
                // 카테고리별 아이콘 매칭
                let icon = 'fa-server';
                let iconColor = 'text-slate-500';
                
                if(p.category === 'HV' || p.category === 'LV') { icon = 'fa-bolt'; iconColor = 'text-amber-500'; }
                if(p.category === 'TR') { icon = 'fa-bolt-lightning'; iconColor = 'text-yellow-500'; }
                if(p.category === 'UPS') { icon = 'fa-car-battery'; iconColor = 'text-blue-500'; }
                if(p.category === 'GEN') { icon = 'fa-power-off'; iconColor = 'text-red-500'; }

                let sn = '-';
                if(p.eq1 && p.eq1.specs) {
                    const snSpec = p.eq1.specs.find(s => s.k === 'Serial No.' || s.k === 'ENGINE NO.');
                    if(snSpec) sn = snSpec.v;

                this.classList.add('bg-blue-600/10', 'text-blue-400');
                
                // 상태 업데이트

                document.getElementById('currentCategoryTitle').innerText = this.innerText.trim();
                
                // 렌더링
                renderCards();

        });

        // 검색
        function applySearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.filter-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                const purpose = card.getAttribute('data-purpose').toLowerCase();
                
                if(name.includes(term) || purpose.includes(term)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            document.getElementById('resultCount').innerText = `총 ${visibleCount}건 조회됨`;

                <section class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
                    <div class="bg-slate-50/50 px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                        <div class="flex items-center">
                            <i class="fa-solid ${icons[idx % 4]} text-slate-400 w-5 text-center mr-2"></i>
                            <h4 class="font-bold text-slate-700 text-sm">NO. ${idx+1} - ${eq.title}</h4>
                        </div>
                        <span class="text-xs font-bold text-slate-500 bg-white border border-slate-200 px-2 py-0.5 rounded-full">${eq.qty}</span>
                    </div>
                    <table class="info-table">
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </section>`;
            });
            
            eqContainer.innerHTML = eqHtml;

            const backdrop = document.getElementById('slideOverBackdrop');
            const panel = document.getElementById('slideOverPanel');
            backdrop.classList.remove('pointer-events-none');
            backdrop.classList.add('opacity-100');
            panel.classList.remove('translate-x-full');
        };

        window.closePanel = function() {
            const backdrop = document.getElementById('slideOverBackdrop');
            const panel = document.getElementById('slideOverPanel');
            panel.classList.add('translate-x-full');
            backdrop.classList.remove('opacity-100');
            setTimeout(() => { backdrop.classList.add('pointer-events-none'); }, 300);
        };

        renderCards();
    </script>
</body>
</html>
