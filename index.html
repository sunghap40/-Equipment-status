        function applySearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.filter-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                const purpose = card.getAttribute('data-purpose').toLowerCase();
                
                if(name.includes(term) || purpose.includes(term)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('resultCount').innerText = `총 ${visibleCount}건 조회`;
        }
        
        document.getElementById('searchInput').addEventListener('input', applySearch);

        window.openPanel = function(id) {
            const data = panelData.find(p => p.id === id);
            if(!data) return;
            
            document.getElementById('p_id').innerText = data.id;
            document.getElementById('p_title').innerText = data.basic.no;
            document.getElementById('p_type').innerText = data.basic.type;
            document.getElementById('p_loc').innerText = data.basic.loc;
            document.getElementById('p_purpose').innerText = data.basic.purpose;
            document.getElementById('p_maker').innerText = data.basic.maker;
            document.getElementById('p_qty').innerText = data.basic.qty;
            document.getElementById('p_mfg').innerText = data.basic.mfg_date;
            document.getElementById('p_inst').innerText = data.basic.inst_date;
            document.getElementById('p_size').innerText = data.basic.size;
            document.getElementById('p_weight').innerText = data.basic.weight;

            const eqContainer = document.getElementById('p_equipments');
            let eqHtml = '';
            
            // Generate list dynamically from eq1, eq2, eq3 ... eqN
            const eqKeys = Object.keys(data).filter(k => k.startsWith('eq')).sort((a,b) => parseInt(a.replace('eq','')) - parseInt(b.replace('eq','')));
            const icons = ['fa-microchip', 'fa-plug', 'fa-fan', 'fa-shield-halved', 'fa-box', 'fa-gears'];
            const colors = ['border-amber-500', 'border-green-500', 'border-blue-500', 'border-purple-500', 'border-rose-500', 'border-teal-500'];

            eqKeys.forEach((key, idx) => {
                const eq = data[key];
                if(!eq || !eq.specs) return;
                
                const bColor = colors[idx % colors.length];
                const iconClass = icons[idx % icons.length];
                let rowsHtml = '';
                
                eq.specs.forEach(s => {
                    let vClass = 'text-slate-700';
                    if(s.k === 'Serial No.' || s.k === 'ENGINE NO.') vClass = 'font-mono font-bold text-red-600 bg-red-50 px-1 py-0.5 rounded tracking-wide border border-red-100';
                    if(s.k === '모델' || s.k === 'Type') vClass = 'font-semibold text-blue-700';
                    if(s.k === '계전요소') vClass = 'font-bold text-slate-800 text-xs tracking-tight';
                    
                    rowsHtml += `<tr><th class="w-1/3 bg-slate-50">${s.k}</th><td><span class="${vClass}">${s.v}</span></td></tr>`;
                });

                eqHtml += `
                <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="bg-slate-100/50 px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                        <div class="flex items-center">
                            <i class="fa-solid ${iconClass} text-slate-400 w-5 text-center mr-2"></i>
                            <h4 class="font-bold text-slate-800 text-sm">NO. ${idx+1} - ${eq.title}</h4>
                        </div>
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded-full">${eq.qty}</span>
                    </div>
                    <table class="info-table">
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </section>`;
            });
            
            eqContainer.innerHTML = eqHtml;
            const backdrop = document.getElementById('slideOverBackdrop');
            const panel = document.getElementById('slideOverPanel');
            backdrop.classList.remove('pointer-events-none');
            backdrop.classList.add('opacity-100');
            panel.classList.remove('translate-x-full');
        };

        window.closePanel = function() {
            const backdrop = document.getElementById('slideOverBackdrop');
            const panel = document.getElementById('slideOverPanel');
            panel.classList.add('translate-x-full');
            backdrop.classList.remove('opacity-100');
            setTimeout(() => { backdrop.classList.add('pointer-events-none'); }, 300);
        };

        renderCards();
    </script>
</body>
</html>
